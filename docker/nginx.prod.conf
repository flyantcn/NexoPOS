# NexoPOS Nginx 配置
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # ===== Laravel 重写规则 =====
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ===== 禁止访问敏感目录 =====
    location ~* ^/(app|config|database|resources|routes|storage|vendor|bootstrap|\.git|composer\.(json|lock)|artisan)$ {
        deny all;
    }

    # ===== PHP 转发到 php-fpm =====
    location ~ \.php$ {
        try_files $uri =404;
        resolver 10.89.1.1 valid=10s ipv6=off;
        set $php_upstream "php:9000";
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # ===== 静态资源缓存 =====
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # ===== 客户端上传 =====
    client_max_body_size 50M;
}
