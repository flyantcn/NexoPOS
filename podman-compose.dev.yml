# ====================================================================
# NexoPOS Podman Compose —— 开发/测试环境
# 支持 amd64 和 arm64 (Armbian)
# ====================================================================
# 使用方法:
#   1. 复制项目到小主机
#   2. 复制 .env.example 为 .env，按需修改 DB_HOST=db
#   3. podman compose up -d --build
#   4. podman compose exec php composer install
#   5. podman compose exec php php artisan key:generate
#   6. podman compose exec php php artisan migrate --seed
#   7. 浏览器访问 http://<小主机IP>:8080
# ====================================================================

services:
  # -------------------- 后端 PHP-FPM --------------------
  php:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    image: nexopos-php:dev
    container_name: nexopos-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # 挂载项目目录（代码实时同步）
      - .:/var/www/html:z
      # 持久化 Composer 依赖缓存
      - php_composer_cache:/root/.composer
      # 持久化 Node 依赖缓存
      - php_npm_cache:/root/.npm
      # Laravel storage 和 bootstrap/cache 需要写入权限
      - ./storage:/var/www/html/storage:z
      - ./bootstrap/cache:/var/www/html/bootstrap/cache:z
    depends_on:
      - db
    environment:
      - DB_HOST=host.containers.internal
      - DB_PORT=3307
      - DB_DATABASE=${DB_DATABASE:-nexopos}
      - DB_USERNAME=${DB_USERNAME:-nexopos}
      - DB_PASSWORD=${DB_PASSWORD:-nexopos_secret}
      - APP_ENV=local
      - APP_DEBUG=true
      - NS_ENV=local
    networks:
      - nexopos-net
    # 方便直接 exec 进容器执行 artisan/composer/npm 命令
    stdin_open: true
    tty: true

  # -------------------- Web 服务器 Nginx --------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: nexopos-nginx
    restart: unless-stopped
    ports:
      # 外部访问: http://<小主机IP>:8080
      - "8080:80"
    volumes:
      - .:/var/www/html:z
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - php
    networks:
      - nexopos-net

  # -------------------- 数据库 MariaDB --------------------
  db:
    image: mariadb:11
    container_name: nexopos-db
    restart: unless-stopped
    ports:
      # 可选: 让本地电脑也能连数据库（开发用）
      # "3306:3306"
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_secret}
      - MARIADB_DATABASE=${DB_DATABASE:-nexopos}
      - MARIADB_USER=${DB_USERNAME:-nexopos}
      - MARIADB_PASSWORD=${DB_PASSWORD:-nexopos_secret}
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexopos-net

  # -------------------- 可选: Redis（缓存/队列优化） --------------------
  redis:
    image: redis:7-alpine
    container_name: nexopos-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - nexopos-net

  queue-worker:
    image: nexopos-php:dev
    container_name: nexopos-worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html:z
      - ./storage:/var/www/html/storage:z
      - ./bootstrap/cache:/var/www/html/bootstrap/cache:z
      - php_composer_cache:/root/.composer
      - php_npm_cache:/root/.npm
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=host.containers.internal
      - DB_PORT=3307
      - DB_DATABASE=${DB_DATABASE:-nexopos}
      - DB_USERNAME=${DB_USERNAME:-nexopos}
      - DB_PASSWORD=${DB_PASSWORD:-nexopos_secret}
      - APP_ENV=local
      - APP_DEBUG=true
      - NS_ENV=local
    networks:
      - nexopos-net
    stdin_open: true
    tty: true

volumes:
  db_data:
  nginx_logs:
  php_composer_cache:
  php_npm_cache:
  redis_data:

networks:
  nexopos-net:
    driver: bridge
