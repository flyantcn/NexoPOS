services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexopos-php:prod
    container_name: nexopos-prod-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:z
      - ./storage:/var/www/html/storage:z
      - ./bootstrap/cache:/var/www/html/bootstrap/cache:z
      - php_composer_cache:/root/.composer
      - php_npm_cache:/root/.npm
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - NS_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-nexopos}
      - DB_USERNAME=${DB_USERNAME:-nexopos}
      - DB_PASSWORD=${DB_PASSWORD:-nexopos_secret}
    networks:
      - nexopos-prod-net
    stdin_open: true
    tty: true

  queue-worker:
    image: nexopos-php:prod
    container_name: nexopos-prod-worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html:z
      - ./storage:/var/www/html/storage:z
      - ./bootstrap/cache:/var/www/html/bootstrap/cache:z
      - php_composer_cache:/root/.composer
      - php_npm_cache:/root/.npm
    depends_on:
      - php
      - db
      - redis
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - NS_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-nexopos}
      - DB_USERNAME=${DB_USERNAME:-nexopos}
      - DB_PASSWORD=${DB_PASSWORD:-nexopos_secret}
    networks:
      - nexopos-prod-net

  nginx:
    image: nginx:1.27-alpine
    container_name: nexopos-prod-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:z
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - php
    networks:
      - nexopos-prod-net

  db:
    image: mariadb:11
    container_name: nexopos-prod-db
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_secret}
      - MARIADB_DATABASE=${DB_DATABASE:-nexopos}
      - MARIADB_USER=${DB_USERNAME:-nexopos}
      - MARIADB_PASSWORD=${DB_PASSWORD:-nexopos_secret}
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexopos-prod-net

  redis:
    image: redis:7-alpine
    container_name: nexopos-prod-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - nexopos-prod-net

volumes:
  db_data:
  nginx_logs:
  php_composer_cache:
  php_npm_cache:
  redis_data:

networks:
  nexopos-prod-net:
    driver: bridge
